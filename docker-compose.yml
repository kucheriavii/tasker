services:
  postgres:
    image: postgres:16-alpine
    container_name: tasker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tasker
      POSTGRES_USER: tasker
      POSTGRES_PASSWORD: tasker_secret_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasker -d tasker"]
      interval: 5s
      timeout: 5s
      retries: 5

  tasker:
    build: .
    container_name: tasker-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://tasker:tasker_secret_password@postgres:5432/tasker
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      APP_URL: ${APP_URL:-}
      PORT: 3000
    volumes:
      # Mount existing local SQLite data for automatic one-time migration to PostgreSQL
      - ./server/data:/app/server/data:ro
      - ./.env:/app/.env:ro
      - ./server/ai-import.mjs:/app/server/ai-import.mjs:ro
      - ./server/features.mjs:/app/server/features.mjs:ro
      - ./server/auth.mjs:/app/server/auth.mjs:ro
      - ./server/server.mjs:/app/server/server.mjs:ro

volumes:
  pgdata:
